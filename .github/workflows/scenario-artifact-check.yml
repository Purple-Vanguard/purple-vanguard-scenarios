name: Scenario artifact verification

on:
  pull_request:
    paths:
      - "scenarios/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches:
      - "feature/badblueprint"
    paths:
      - "scenarios/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/**"

jobs:
  verify-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario:
          - badblueprint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify scenario artifacts
        run: python scripts/verify_scenario_artifacts.py ${{ matrix.scenario }}
